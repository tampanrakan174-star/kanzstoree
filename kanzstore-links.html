<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KanzStore — Akun Free Fire Premium, Aman &amp; Bergaransi</title>
<meta name="description" content="Toko akun Free Fire terpercaya di Indonesia. Pilih akun Gagah Abis sampai B ajaa dengan spesifikasi jelas, harga transparan, dan garansi 15 hari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C; --bg-2:#0E0E13; --surface:#131318; --surface-2:#191920;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --text:#F4F2ED; --muted:#9E9CA6;
  --primary:#FF7A18; --primary-2:#FFA34D; --primary-soft:rgba(255,122,24,.13);
  --accent:#C6F24E; --radius:20px; --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);line-height:1.6;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand{font-family:"Sora","Plus Jakarta Sans",sans-serif;line-height:1.15;letter-spacing:-.02em;margin:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
ul{margin:0;padding:0;list-style:none}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 20px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-2);background:var(--primary-soft);border:1px solid rgba(255,122,24,.25);padding:6px 12px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;border:1px solid transparent;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#14100B}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:rgba(255,255,255,.05);border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary-2)}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(10,10,12,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#FF9A3E,#E2570A);display:flex;align-items:center;justify-content:center;color:#140F09;font-size:17px;flex:0 0 auto}
.nav-links{display:none;align-items:center;gap:26px;font-size:14px;color:var(--muted)}
.nav-links a:hover{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-cta{display:none}
.burger{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.mobile-menu{display:none;border-top:1px solid var(--line);background:var(--bg-2);padding:14px 20px 18px}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:10px 0;font-size:15px;color:var(--muted);border-bottom:1px solid var(--line)}
.mobile-menu a:last-child{border:0}
/* hero */
.hero{position:relative;padding:48px 0 44px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-30% -10% auto -10%;height:520px;background:radial-gradient(50% 60% at 30% 40%,rgba(255,122,24,.18),transparent 70%),radial-gradient(40% 50% at 80% 20%,rgba(198,242,78,.08),transparent 70%);pointer-events:none}
.hero-grid{position:relative;display:grid;gap:32px}
.hero h1{font-size:34px;margin:16px 0 14px}
.hero h1 span{color:var(--primary-2)}
.hero p.lead{color:var(--muted);font-size:15px;max-width:52ch;margin:0 0 22px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.hero-stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.hero-stats b{display:block;font-family:"Sora",sans-serif;font-size:20px}
.hero-stats span{font-size:12px;color:var(--muted)}
.hero-visual{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);height:280px}
.hero-visual img{width:100%;height:100%;object-fit:cover;object-position:top}
.hero-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.1),rgba(10,10,12,.85))}
.hero-badge{position:absolute;left:16px;bottom:16px;right:16px;z-index:2;display:flex;align-items:center;gap:12px;background:rgba(16,16,20,.86);border:1px solid var(--line-2);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px)}
.hero-badge i{color:var(--accent);font-size:20px}
.hero-badge b{display:block;font-size:13px}
.hero-badge span{font-size:11px;color:var(--muted)}
/* trust */
.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2)}
.trust-in{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.trust-item{display:flex;align-items:center;gap:10px;padding:16px 14px;background:var(--bg-2);font-size:12px;color:var(--muted)}
.trust-item i{color:var(--primary);font-size:18px}
/* sections */
.section{padding:56px 0}
.section-alt{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:640px;margin-bottom:28px}
.sec-head h2{font-size:26px;margin:12px 0 10px}
.sec-head p{color:var(--muted);font-size:14px;margin:0}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#14100B}
/* catalog */
.grid{display:grid;grid-template-columns:1fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{border-color:rgba(255,122,24,.4);transform:translateY(-3px)}
.card-media{position:relative;height:190px;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;object-position:top}
.card-media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,0),rgba(19,19,24,.75))}
.tier{position:absolute;top:12px;left:12px;z-index:2;font-size:11px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:999px;background:rgba(10,10,12,.75);border:1px solid var(--line-2);color:var(--accent);backdrop-filter:blur(6px)}
.disc{position:absolute;top:12px;right:12px;z-index:2;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--primary);color:#14100B}
.card-body{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
.card-body h3{font-size:16px}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.spec{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.spec span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.spec b{font-size:12px;font-weight:600}
.hl{display:flex;flex-direction:column;gap:6px}
.hl li{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.hl i{color:var(--accent);font-size:14px;line-height:1.4;flex:0 0 auto}
.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:14px;border-top:1px dashed var(--line-2)}
.price-now{font-family:"Sora",sans-serif;font-size:19px;font-weight:700}
.price-was{display:block;font-size:12px;color:var(--muted);text-decoration:line-through}
.stock{font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:4px 9px;border-radius:999px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius)}
/* steps */
.steps{display:grid;gap:14px}
.step{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.step-n{width:32px;height:32px;border-radius:10px;background:var(--primary-soft);border:1px solid rgba(255,122,24,.3);color:var(--primary-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.step h3{font-size:14px;margin-bottom:4px}
.step p{margin:0;font-size:12px;color:var(--muted)}
/* why */
.why{display:grid;gap:14px}
.why-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.why-card i{font-size:24px;color:var(--primary)}
.why-card h3{font-size:14px;margin:12px 0 6px}
.why-card p{margin:0;font-size:12px;color:var(--muted)}
/* testimonials */
.quote{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.stars
